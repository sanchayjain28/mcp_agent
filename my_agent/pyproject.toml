[project]
name = "my-agent"
version = "0.1.0"
description = "LangGraph MCP Adapter System for Role Data Search with fuzzy matching and role mappings"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-mcp-adapters>=0.1.0",
    "fastmcp>=0.9.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "streamlit>=1.28.0",
    "pandas>=2.0.0",
    "thefuzz>=0.19.0",
    "python-levenshtein>=0.21.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.0",
    "aiosqlite>=0.19.0",
    "memora",
    "ipdb>=0.13.13",
]

[tool.uv.sources]
memora = { git = "https://github.com/agentic-mcp-tools/memora.git" }

# System Requirements
# For Bright Data MCP server support:
# - Node.js (v20+) and npm (includes npx)
#   Install via: curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.0/install.sh | bash
#   Then: nvm install --lts
#   Or install Node.js directly from https://nodejs.org/
